# 学習管理WebUI server の設定（design.md §1.5）。初回は `cp server.example.toml server.toml`。
# server.toml は git 管理しない。相対パスはリポジトリ直下（td_plan/）からの相対。

[remote]                                   # 学習用PCの singularity instance 内の sshd（design.md §1.6）
host             = "100.x.x.x"             # instance の tailscale の IP（~/.ssh/config の Host エイリアスでも可）
user             = "student"
port             = 2222
key_path         = "~/.ssh/id_ed25519"
# 以下のパスはすべてコンテナの中から見たパス
repo_dir         = "/home/user/td_plan"          # コード同期先
python           = "python3"                          # コンテナ内のpython（repo_dir からの相対パスも可）
run_root         = "/home/user/train_webui_runs"  # run.log / run.pid / run.exit（repo_dirの外）
stop_timeout_sec = 10                                 # SIGTERM後、SIGKILLまで待つ秒数

[server]                                   # ローカルPC(WSL)のWebUI server
host       = "0.0.0.0"
port       = 8000
public_url = "http://100.x.x.x:8000"       # 学習用PCから見たこのserverのURL（tailscaleのIP）
db_path    = "train_webui/data/webui.sqlite"
media_dir  = "train_webui/data/media"      # 受信画像・取り込んだrun.log
# 接続を受け付ける接続元（これ以外は403）。tailscale の帯域とこのPC自身。
allowed_networks = ["127.0.0.0/8", "::1/128", "100.64.0.0/10", "fd7a:115c:a1e0::/48"]

[log]
poll_interval_sec = 1.5                    # run.log の pull / ジョブ生存確認の間隔

[heartbeat]
lost_after_sec = 180                       # CLI起動runのheartbeatがこの秒数途絶えたら lost

[gpu]
# 学習開始・[infer] の前に学習用PCのGPUを確認し、自分たち以外（他の人）がこのMiB数より多くGPUメモリを
# 使っていたら起動しない（design.md §4）。省略時 1024。
busy_threshold_mib = 1024

[sync]
# コードrsync（design.md §4.5）で除外するパス（rsyncの --exclude パターン）。
exclude = [
  ".git/", "venv/", ".venv/", "wandb/", "__pycache__/", "*.pyc",
  "checkpoints/*", "samples/*", "config.toml",  # 中身だけ除外（ディレクトリ自体は作る。学習用PC側の中身は --delete でも消えない）
  "data/", "scratch/*/data/", "scratch/prts_survey/output/",
  "train_webui/data/", "train_webui/frontend/", "train_webui/server.toml",
  ".claude/", ".dvc/", ".pytest_cache/", "logs/", "papers/", "textbooks/",
]
